<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Train Smart</title><style>
:root{--b:#f6f8fb;--c:#fff;--i:#0f172a;--m:#64748b;--l:#e2e8f0;--a:#0f766e;--s:#ccfbf1}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:14px 16px}header b{font-size:18px}header small{display:block;color:#cbd5e1;margin-top:3px}main{max-width:720px;margin:auto;padding:14px 14px 92px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--l);border-radius:14px;padding:12px}.metric small{color:var(--m);text-transform:uppercase;font-weight:700;font-size:10px}.metric strong{display:block;font-size:20px;margin-top:3px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:var(--a);color:#fff}.ghost{background:#fff;color:var(--i);border:1px solid var(--l)}select,input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit}label{font-size:11px;color:var(--m);display:block;margin-bottom:4px}.phase{padding:10px;border:1px solid var(--l);border-radius:12px;margin:8px 0}.phase.on{background:var(--s);border-color:#5eead4}.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700}.tabs button.on{background:#0f172a;color:#fff}.ex{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.ex:last-child{border-bottom:0}.ex h3{margin:0 0 4px;font-size:14px}.muted{color:var(--m);font-size:11px}.load input{text-align:center;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;padding:8px 2px;font-size:11px;color:var(--m)}.nav button.on{color:var(--a);font-weight:800}.row{display:flex;gap:8px}.row>*{flex:1}.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}.pill{display:inline-block;background:#eef2f7;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}@media(max-width:420px){.ex{grid-template-columns:1fr 88px}}
</style></head><body><header><b>Train Smart</b><small id="sub">Plano de 24 semanas</small></header><main id="app"></main><nav class="nav" id="nav"></nav><script>
const K='train-smart-v1';const plans={
definicao:{n:'Definição',p:[[1,4,'Base','hip'],[5,10,'Hipertrofia','hip'],[11,14,'Força','for'],[15,20,'Hipertrofia II','hip'],[21,22,'Condicionamento','res'],[23,23,'Deload','del'],[24,24,'Avaliação','eva']]},
hipertrofia:{n:'Hipertrofia',p:[[1,4,'Base','hip'],[5,10,'Acúmulo','hip'],[11,14,'Força','for'],[15,20,'Hipertrofia II','hip'],[21,23,'Intensificação','hip'],[24,24,'Deload','del']]},
forca:{n:'Força',p:[[1,4,'Base técnica','for'],[5,10,'Força I','for'],[11,16,'Intensificação','for'],[17,20,'Força II','for'],[21,23,'Deload','del'],[24,24,'Avaliação','eva']]},
resistencia:{n:'Resistência',p:[[1,4,'Base','res'],[5,10,'Resistência I','res'],[11,16,'Resistência II','res'],[17,20,'Condicionamento','res'],[21,23,'Consolidação','res'],[24,24,'Deload','del']]},
condicionamento:{n:'Condicionamento',p:[[1,4,'Base','res'],[5,8,'Resistência','res'],[9,12,'Aeróbio','res'],[13,18,'Misto','res'],[19,22,'HIIT','res'],[23,23,'Deload','del'],[24,24,'Avaliação','eva']]}}
const workouts={hip:{A:['Supino inclinado máquina','Supino reto halteres','Chest press','Elevação lateral','Tríceps corda'],B:['Puxada alta','Remada apoiada','Puxada neutra','Reverse fly','Rosca Scott'],C:['Hack/belt squat','Leg press 45°','Cadeira extensora','Mesa flexora','Hip thrust','Panturrilha'],D:['Supino inclinado máquina','Remada apoiada','Crossover','Puxada neutra','Elevação lateral'],E:['Cadeira flexora','Leg press unilateral','Hip thrust','Cadeira extensora','Panturrilha']},for:{A:['Leg press 45°','Supino máquina','Remada apoiada','Desenvolvimento máquina'],B:['Puxada alta','Hack/belt squat','Mesa flexora','Rosca Scott'],C:['Supino inclinado máquina','Remada apoiada','Leg press unilateral','Puxada neutra']},res:{A:['Leg press','Supino máquina','Puxada neutra','Elevação lateral','Cadeira flexora'],B:['Hack/belt squat','Remada apoiada','Crossover','Rosca martelo','Tríceps corda'],C:['Bicicleta / elíptico','Leg press unilateral','Puxada alta','Reverse fly']},del:{A:['Leg press','Supino máquina','Puxada','Cadeira flexora'],B:['Remada apoiada','Elevação lateral','Rosca máquina','Tríceps corda']},eva:{A:['Caminhada leve / mobilidade']}};
let s=JSON.parse(localStorage.getItem(K)||'{"goal":"definicao","week":1,"tab":"home","day":"A","loads":{},"body":[]}');const save=()=>localStorage.setItem(K,JSON.stringify(s));const P=()=>plans[s.goal];const F=()=>P().p.find(x=>s.week>=x[0]&&s.week<=x[1]);const W=()=>workouts[F()[3]]||workouts.hip;const days=()=>Object.keys(W());function nav(){let a=[['home','Início'],['plan','Plano'],['work','Treino'],['prog','Progresso'],['profile','Perfil']];document.querySelector('#nav').innerHTML=a.map(x=>`<button class="${s.tab==x[0]?'on':''}" onclick="s.tab='${x[0]}';save();render()">${x[1]}</button>`).join('')}
function render(){if(!days().includes(s.day))s.day=days()[0];document.querySelector('#sub').textContent=`${P().n} • Semana ${s.week}/24 • ${F()[2]}`;nav();document.querySelector('#app').innerHTML=({home,plan,work,prog,profile}[s.tab]||home)()}
function home(){let b=s.body.at(-1),pct=Math.round(s.week/24*100);return `<h1>Seu plano</h1><p class="muted">Objetivo atual: ${P().n}</p><div class="grid"><div class="metric"><small>Semana</small><strong>${s.week}/24</strong></div><div class="metric"><small>Fase</small><strong>${F()[2]}</strong></div><div class="metric"><small>Peso</small><strong>${b?.w?b.w+' kg':'94 kg'}</strong></div><div class="metric"><small>Cintura</small><strong>${b?.c?b.c+' cm':'103 cm'}</strong></div></div><div class="card"><h2>Progresso do plano</h2><div class="bar"><i style="width:${pct}%"></i></div><p class="muted">${pct}% concluído</p></div><button class="btn" onclick="s.tab='work';save();render()">Iniciar treino</button>`}
function plan(){return `<h1>Plano de 24 semanas</h1><div class="card"><label>Objetivo</label><select onchange="s.goal=this.value;s.week=1;save();render()">${Object.entries(plans).map(([k,v])=>`<option value="${k}" ${s.goal==k?'selected':''}>${v.n}</option>`).join('')}</select><br><br><label>Semana atual</label><input type="number" min="1" max="24" value="${s.week}" onchange="s.week=Math.max(1,Math.min(24,+this.value||1));save();render()"></div><div class="card">${P().p.map(x=>`<div class="phase ${s.week>=x[0]&&s.week<=x[1]?'on':''}"><b>${x[0]==x[1]?x[0]:x[0]+'–'+x[1]} • ${x[2]}</b><div class="muted">${x[3]=='hip'?'Hipertrofia':x[3]=='for'?'Força':x[3]=='res'?'Resistência/condicionamento':x[3]=='del'?'Deload':'Avaliação'}</div></div>`).join('')}</div>`}
function rx(){return F()[3]=='for'?'4 séries • 4–6 reps • RIR 2–3':F()[3]=='res'?'3 séries • 12–20 reps • RIR 2':F()[3]=='del'?'2 séries • 8–12 reps • RIR 4':'3–4 séries • 6–15 reps • RIR 1–2'}function key(ex){return `${s.goal}|${s.week}|${s.day}|${ex}`}
function work(){let d=days();return `<h1>Treino</h1><p class="muted">Registre somente a carga utilizada.</p><div class="tabs">${d.map(x=>`<button class="${s.day==x?'on':''}" onclick="s.day='${x}';save();render()">${x}</button>`).join('')}</div><div class="card"><span class="pill">${F()[2]}</span>${W()[s.day].map(ex=>`<div class="ex"><div><h3>${ex}</h3><div class="muted">${rx()}</div><div class="muted">Última: ${last(ex)}</div></div><div class="load"><label>Carga hoje</label><input type="number" step="0.5" value="${s.loads[key(ex)]||''}" placeholder="kg" onchange="s.loads['${key(ex)}']=this.value;save()"></div></div>`).join('')}</div>`}
function last(ex){let vals=Object.entries(s.loads).filter(([k,v])=>k.split('|')[3]==ex&&v).map(x=>+x[1]);return vals.length?vals.at(-1)+' kg':'—'}function prog(){let hist={};Object.entries(s.loads).forEach(([k,v])=>{if(!v)return;let a=k.split('|'),ex=a[3];(hist[ex]??=[]).push({w:a[1],v:+v})});let names=Object.keys(hist);return `<h1>Progresso</h1>${names.length?names.map(n=>{let a=hist[n],best=Math.max(...a.map(x=>x.v));return `<div class="card"><h2>${n}</h2><div class="grid"><div class="metric"><small>Última</small><strong>${a.at(-1).v} kg</strong></div><div class="metric"><small>Melhor</small><strong>${best} kg</strong></div></div><p class="muted">${a.slice(-6).map(x=>'S'+x.w+': '+x.v+' kg').join(' • ')}</p></div>`}).join(''):'<div class="card">Registre cargas nos treinos para criar seu histórico.</div>'}`}
function profile(){let rows=s.body.slice().reverse();return `<h1>Perfil</h1><div class="card"><p><b>30 anos</b> • 1,80 m • inicial 94 kg • cintura 103 cm</p><p class="muted">BF estimado: ~23% (referência, não medição clínica).</p></div><div class="card"><h2>Evolução corporal</h2><div class="row"><div><label>Peso kg</label><input id="pw" type="number" step="0.1"></div><div><label>Cintura cm</label><input id="pc" type="number" step="0.1"></div></div><br><button class="btn" onclick="addBody()">Salvar medição</button></div>${rows.map(x=>`<div class="card"><b>${x.d}</b><p>${x.w||'—'} kg • ${x.c||'—'} cm</p></div>`).join('')}`}
function addBody(){let w=+document.querySelector('#pw').value||null,c=+document.querySelector('#pc').value||null;if(!w&&!c)return;s.body.push({d:new Date().toLocaleDateString('pt-BR'),w,c});save();render()}render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
